name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # `--if-present` keeps CI green while a workspace package has no build
      # step yet. Drop it once every package ships one.
      - name: Build
        run: pnpm -r --if-present build

      - name: Bundle budget
        run: pnpm --filter web check:bundle

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The offline PWA spec needs real chunk hashes, so it runs against a
      # production build. The workflow's webServer performs that build.
      - name: Browser tests
        run: pnpm --filter web e2e
        env:
          E2E_PRODUCTION: "1"
